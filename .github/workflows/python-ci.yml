name: python-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(torch.__version__)"

      - name: Lint (ruff)
        run: |
          make lint

      - name: Lesson contracts
        run: |
          make contract

      - name: Model fidelity metadata
        run: |
          make fidelity

      - name: Repository narrative contract
        run: |
          make narrative

      - name: Tests (pytest)
        run: |
          pytest
