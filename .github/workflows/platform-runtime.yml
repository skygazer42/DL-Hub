name: Platform runtime

on:
  push:
    branches:
      - 'platform-runtime-verify/**'
  workflow_dispatch:
    inputs:
      target:
        description: Platform runtime to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - mps

permissions:
  contents: read

concurrency:
  group: platform-runtime-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows filesystem and CPU runtime
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install platform test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "torch==2.13.0"
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Run Windows platform contract tests
        run: python -m pytest tests/test_platform_runtime_check.py -q

      - name: Exercise Windows filesystem and CPU runtime
        run: >-
          python scripts/platform_runtime_check.py
          --device cpu
          --require-device cpu
          --require windows
          --output "${{ runner.temp }}/platform-runtime-windows.json"

      - name: Run one real offline lesson on Windows
        env:
          DLHUB_OUTPUTS_DIR: ${{ runner.temp }}/dlhub-lesson-output
        run: >-
          python -m tracks.foundations.lesson_02_linear_regression_autograd.train
          --epochs 1
          --num-samples 128
          --batch-size 32
          --max-train-batches 2
          --max-eval-batches 1
          --device cpu
          --run-name windows-platform

      - name: Validate Windows lesson artifacts
        env:
          DLHUB_OUTPUTS_DIR: ${{ runner.temp }}/dlhub-lesson-output
        run: |
          $runDir = Join-Path $env:DLHUB_OUTPUTS_DIR "foundations/lesson_02_linear_regression_autograd/windows-platform"
          $required = @(
            "config.json",
            "metrics.jsonl",
            "checkpoints/checkpoint.pt",
            "logs/train.log"
          )
          foreach ($relativePath in $required) {
            $artifact = Join-Path $runDir $relativePath
            if (-not (Test-Path -Path $artifact -PathType Leaf)) {
              throw "Missing lesson artifact: $artifact"
            }
            if ((Get-Item $artifact).Length -eq 0) {
              throw "Empty lesson artifact: $artifact"
            }
          }
          Get-Content (Join-Path $runDir "config.json") -Raw | ConvertFrom-Json | Out-Null
          $metrics = Get-Content (Join-Path $runDir "metrics.jsonl") | ConvertFrom-Json
          if (($metrics | Measure-Object).Count -ne 1) {
            throw "Expected exactly one metrics record"
          }

      - name: Upload Windows runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-runtime-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-runtime-windows.json
            ${{ runner.temp }}/dlhub-lesson-output/
          if-no-files-found: warn
          retention-days: 7

  mps:
    name: Apple Silicon MPS runtime
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'mps' }}
    # macos-14-arm64 exposes MPS as available but its virtualized GPU cannot
    # allocate memory. macos-15 is GitHub's supported native MPS boundary.
    # https://github.com/actions/runner-images/issues/9918
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install platform test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "torch==2.13.0"
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Run portable platform contract tests
        run: python -m pytest tests/test_platform_runtime_check.py -q

      - name: Exercise the real MPS runtime
        run: >-
          python scripts/platform_runtime_check.py
          --device mps
          --require-device mps
          --require mps
          --output "${{ runner.temp }}/platform-runtime-mps.json"

      - name: Upload MPS runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-runtime-mps-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-runtime-mps.json
          if-no-files-found: warn
          retention-days: 7
