name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'requirements-docs.txt'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'requirements-docs.txt'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-docs.txt
          python -m pip check

      - name: Build docs
        run: make docs

      - name: Skip Pages deploy
        if: ${{ github.event_name != 'pull_request' && (github.ref != 'refs/heads/main' || github.event.repository.has_pages != true) }}
        run: echo "Pages deployment requires the main branch and enabled GitHub Pages; docs were built only."

      - name: Archive Pages site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages == true }}
        # Keep the upload dependency directly pinned instead of using a composite
        # action whose internal upload-artifact reference is a mutable major tag.
        run: |
          tar \
            --dereference \
            --hard-dereference \
            --directory site \
            --create \
            --file "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
