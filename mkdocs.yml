site_name: DL-Hub 文档
site_url: https://skygazer42.github.io/DL-Hub
site_description: DL-Hub — 从零手写，循序渐进 — PyTorch 深度学习统一学习项目
site_author: DL-Hub Contributors
repo_name: skygazer42/DL-Hub
repo_url: https://github.com/skygazer42/DL-Hub
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024-2026 DL-Hub Contributors

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
    logo: material/school
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - announce.dismiss

plugins:
  - search:
      separator: '[\s\u200b\-]'
      lang:
        - zh
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skygazer42/DL-Hub
  generator: false

extra_css:
  - assets/css/custom.css

nav:
  - 首页: index.md
  - 快速开始:
    - getting-started/index.md
    - 环境要求: getting-started/requirements.md
    - 安装指南: getting-started/installation.md
    - 5 分钟体验: getting-started/quickstart.md
  - 学习赛道:
    - tracks/index.md
    - 基础赛道: tracks/foundations.md
    - 视觉赛道: tracks/vision.md
    - NLP 赛道: tracks/nlp.md
    - GNN 赛道: tracks/gnn.md
    - 点云赛道: tracks/pointcloud.md
    - 生成模型赛道: tracks/generative.md
    - LLM 赛道: tracks/llm.md
    - 多模态赛道: tracks/multimodal.md
  - Model Zoo:
    - zoo/index.md
    - Vision Zoo: zoo/vision-zoo.md
    - NLP Zoo: zoo/nlp-zoo.md
    - Point Cloud Zoo: zoo/pointcloud-zoo.md
    - VLM Zoo: zoo/vlm-zoo.md
    - Generative Zoo: zoo/generative-zoo.md
    - Federated Zoo: zoo/federated-zoo.md
    - Research Directions: zoo/research-directions.md
  - Topic Coverage: topic-coverage.md
  - ML 算法:
    - ml-algorithms/index.md
    - 监督学习: ml-algorithms/supervised.md
    - 无监督学习: ml-algorithms/unsupervised.md
  - 优化工具箱: optimization/index.md
  - 开发者:
    - developer/index.md
    - 项目结构: developer/structure.md
    - 贡献指南: developer/contributing.md
    - 测试指南: developer/testing.md
  - 更新日志: changelog.md
  - FAQ: faq.md
