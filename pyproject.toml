[build-system]
requires = ["setuptools>=77", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "dlhub"
dynamic = ["version"]
description = "Reusable deep-learning utilities behind the DL-Hub lesson tracks"
readme = "README.md"
license = "MIT"
authors = [{ name = "skygazer42", email = "207829897@qq.com" }]
requires-python = ">=3.10"
keywords = ["deep-learning", "education", "pytorch", "model-zoo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/skygazer42/DL-Hub"
Documentation = "https://skygazer42.github.io/DL-Hub"
Repository = "https://github.com/skygazer42/DL-Hub.git"
Issues = "https://github.com/skygazer42/DL-Hub/issues"

[project.optional-dependencies]
# Legacy requirements files forward to these extras; versions live here only.
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ruff>=0.9",
  "black>=24.0",
  "isort>=5.12",
  "pre-commit>=3.0",
  "tomli>=2.0; python_version < '3.11'",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocs-minify-plugin>=0.8",
]
torch = [
  "torch>=2.0",
]
foundations = [
  "torch>=2.0",
]
vision = [
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9",
]
nlp = [
  "torch>=2.0",
]
gnn = [
  "torch>=2.0",
]
pointcloud = [
  "torch>=2.0",
]
generative = [
  "torch>=2.0",
  "torchvision>=0.15",
]
llm = [
  "torch>=2.0",
]
multimodal = [
  "torch>=2.0",
]
all = [
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9",
]

[tool.setuptools.packages.find]
# Only the reusable library is distributable. `tracks/`, `Llms/` and friends
# are lesson content meant to be run from the repo root (see docs/CONVENTIONS.md).
include = ["dlhub*"]

[tool.setuptools.dynamic]
version = { attr = "dlhub.__about__.__version__" }

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py310"
line-length = 100
# This repo is a multi-project learning hub. Keep linting focused on the reusable,
# repo-root runnable code and avoid scanning large paper/replication directories by default.
extend-exclude = [
  "outputs",
  "resources",
]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = [
  "E501", # line length handled by black
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-q", "-ra", "--strict-config", "--strict-markers"]
